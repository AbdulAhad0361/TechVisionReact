<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9" />
  <g>
    <rect x="100" y="100" width="600" height="400" rx="20" fill="url(#grad4)" fill-opacity="0.2" stroke="url(#grad4)" stroke-width="2" />
    
    <!-- IoT Central Hub -->
    <circle cx="400" cy="300" r="60" fill="url(#grad4)" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="2" />
    <text x="400" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#0ea5e9">IoT Hub</text>
    
    <!-- Connected Devices -->
    <!-- Phone -->
    <rect x="200" y="200" width="30" height="50" rx="5" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <text x="215" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Phone</text>
    
    <!-- Thermostat -->
    <circle cx="220" cy="350" r="20" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="220" cy="350" r="12" fill="none" stroke="#0ea5e9" stroke-width="1" />
    <text x="220" y="385" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Thermostat</text>
    
    <!-- Smart Watch -->
    <rect x="300" y="180" width="25" height="30" rx="5" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <rect x="305" y="210" width="15" height="10" rx="2" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <text x="312" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Watch</text>
    
    <!-- Smart Bulb -->
    <circle cx="500" cy="200" r="15" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <path d="M 490 215 L 490 225 L 510 225 L 510 215" fill="none" stroke="#0ea5e9" stroke-width="1" />
    <text x="500" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Smart Bulb</text>
    
    <!-- Smart Speaker -->
    <rect x="550" y="280" width="40" height="60" rx="5" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="570" cy="295" r="7" fill="none" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="570" cy="315" r="7" fill="none" stroke="#0ea5e9" stroke-width="1" />
    <text x="570" y="355" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Speaker</text>
    
    <!-- Smart Fridge -->
    <rect x="480" y="370" width="40" height="60" rx="2" fill="url(#grad4)" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1" />
    <line x1="480" y1="390" x2="520" y2="390" stroke="#0ea5e9" stroke-width="1" />
    <text x="500" y="445" font-family="Arial" font-size="10" text-anchor="middle" fill="#0ea5e9">Fridge</text>
    
    <!-- Connection Lines -->
    <line x1="235" y1="225" x2="340" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="325" y1="210" x2="340" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="240" y1="350" x2="340" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="500" y1="215" x2="460" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="550" y1="310" x2="460" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="480" y1="400" x2="460" y2="300" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" />
    
    <text x="400" y="530" font-family="Arial" font-size="24" text-anchor="middle" fill="#0ea5e9">IoT Ecosystem</text>
  </g>
</svg>