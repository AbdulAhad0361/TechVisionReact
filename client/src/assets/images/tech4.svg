<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9" />
  <g>
    <rect x="100" y="100" width="600" height="400" rx="20" fill="url(#grad4)" fill-opacity="0.2" stroke="url(#grad4)" stroke-width="2" />
    <!-- IoT Ecosystem visualization -->
    <circle cx="400" cy="300" r="100" fill="none" stroke="url(#grad4)" stroke-width="1" />
    <circle cx="400" cy="300" r="150" fill="none" stroke="url(#grad4)" stroke-width="1" stroke-dasharray="5,5" />
    
    <circle cx="400" cy="300" r="30" fill="url(#grad4)" fill-opacity="0.3" stroke="url(#grad4)" stroke-width="2" />
    <circle cx="320" cy="260" r="15" fill="url(#grad4)" fill-opacity="0.3" stroke="url(#grad4)" stroke-width="2" />
    <circle cx="480" cy="260" r="15" fill="url(#grad4)" fill-opacity="0.3" stroke="url(#grad4)" stroke-width="2" />
    <circle cx="350" cy="380" r="15" fill="url(#grad4)" fill-opacity="0.3" stroke="url(#grad4)" stroke-width="2" />
    <circle cx="450" cy="380" r="15" fill="url(#grad4)" fill-opacity="0.3" stroke="url(#grad4)" stroke-width="2" />
    
    <line x1="400" y1="300" x2="320" y2="260" stroke="url(#grad4)" stroke-width="2" />
    <line x1="400" y1="300" x2="480" y2="260" stroke="url(#grad4)" stroke-width="2" />
    <line x1="400" y1="300" x2="350" y2="380" stroke="url(#grad4)" stroke-width="2" />
    <line x1="400" y1="300" x2="450" y2="380" stroke="url(#grad4)" stroke-width="2" />
    
    <text x="400" y="480" font-family="Arial" font-size="24" text-anchor="middle" fill="#06b6d4">IoT Ecosystem</text>
  </g>
</svg>